<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Durum Raporu | Zeki ÇIPLAK</title>
<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#718096;
  --line:#e4e9f1;
  --green:#14966f;
  --red:#d94c5c;
  --blue:#2f6fed;
  --amber:#b7791f;
  --shadow:0 8px 24px rgba(20,31,52,.06);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}
button,input{font:inherit}
.wrap{max-width:1180px;margin:auto;padding:28px 18px 48px}
.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  margin-bottom:24px;
}
h1{margin:0;font-size:28px;letter-spacing:-.03em}
.subtitle{color:var(--muted);margin-top:6px;font-size:14px}
.refresh-info{font-size:12px;color:var(--muted);text-align:right}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
}
.login{padding:16px;margin-bottom:18px}
.login-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto;
  gap:10px;
  align-items:end;
}
label{
  display:block;
  font-size:11px;
  font-weight:700;
  color:var(--muted);
  margin-bottom:5px;
}
input{
  width:100%;
  border:1px solid #d9e0ea;
  background:#fff;
  color:var(--text);
  padding:10px 11px;
  border-radius:9px;
  outline:none;
}
input:focus{border-color:#8eb1f5;box-shadow:0 0 0 3px rgba(47,111,237,.08)}
.auth-label{
  width:100%;
  border:1px solid #d9e0ea;
  background:#f8fafc;
  color:#334155;
  padding:10px 11px;
  border-radius:9px;
  font-weight:750;
}
.btn{
  border:0;
  border-radius:9px;
  padding:10px 16px;
  font-weight:800;
  cursor:pointer;
}
.btn-primary{background:var(--blue);color:white}
.btn-light{background:#edf2f8;color:#334155}
.btn:disabled{opacity:.55;cursor:not-allowed}
.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}
.stat{padding:18px}
.stat-number{font-size:30px;font-weight:900;line-height:1}
.stat-label{font-size:12px;color:var(--muted);margin-top:7px}
.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}
.controls h2{margin:0;font-size:18px}
.controls-right{display:flex;gap:8px;align-items:center}
.search{max-width:300px}
.devices{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.device{padding:18px}
.device-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}
.device-name{font-size:18px;font-weight:850}
.device-id{font-size:11px;color:var(--muted);margin-top:3px}
.status{
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:850;
  white-space:nowrap;
}
.status.online{background:#e7f7f1;color:var(--green)}
.status.offline{background:#fdecee;color:var(--red)}
.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:18px;
}
.meta-box{
  background:#f8fafc;
  border:1px solid #edf0f5;
  padding:10px;
  border-radius:10px;
  min-width:0;
}
.meta-label{
  font-size:10px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.05em;
}
.meta-value{
  margin-top:4px;
  font-size:13px;
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.register-section{
  margin-top:16px;
  border-top:1px solid var(--line);
  padding-top:14px;
}
.register-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-size:13px;
  font-weight:850;
  margin-bottom:7px;
}
.register-count{
  color:var(--muted);
  font-weight:650;
  font-size:11px;
}
.register-list{
  border:1px solid #e8edf4;
  border-radius:11px;
  overflow:hidden;
  background:#fff;
}
.reg-row{
  display:grid;
  grid-template-columns:minmax(90px,1fr) minmax(70px,.75fr) minmax(120px,1.15fr);
  align-items:center;
  gap:10px;
  padding:9px 11px;
  border-bottom:1px solid #edf1f5;
}
.reg-row:last-child{border-bottom:0}
.reg-name{
  font-size:14px;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.reg-value{
  font-size:15px;
  font-weight:900;
  text-align:left;
}
.reg-time{
  font-size:11px;
  color:var(--muted);
  text-align:right;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.reg-loading,.reg-empty,.reg-error{
  padding:14px 12px;
  color:var(--muted);
  font-size:12px;
  text-align:center;
}
.reg-error{color:#a72d3c;background:#fff8f8}
.empty{
  grid-column:1/-1;
  text-align:center;
  padding:44px 20px;
  color:var(--muted);
}
.error{
  background:#fff4f5;
  color:#a72d3c;
  border:1px solid #f4cbd0;
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:16px;
  display:none;
}
.footer{
  margin-top:22px;
  color:#9aa6b5;
  text-align:center;
  font-size:11px;
}
@media(max-width:850px){
  .login-grid{grid-template-columns:1fr 1fr}
  .summary{grid-template-columns:repeat(2,1fr)}
  .devices{grid-template-columns:1fr}
}
@media(max-width:560px){
  .wrap{padding:18px 12px 35px}
  .header,.controls{flex-direction:column}
  .refresh-info{text-align:left}
  .login-grid{grid-template-columns:1fr}
  .summary{grid-template-columns:1fr 1fr}
  .meta{grid-template-columns:1fr 1fr}
  .controls-right{width:100%;flex-wrap:wrap}
  .search{max-width:none}
  .reg-row{grid-template-columns:1fr auto}
  .reg-time{grid-column:1/-1;text-align:left;margin-top:-4px}
}
</style>
</head>
<body>

<div class="wrap">

  <div class="header">
    <div>
      <h1>Sistem Durum Raporu</h1>
      <div class="subtitle">Cihazların güncel bağlantı ve register bilgileri</div>
    </div>
    <div class="refresh-info">
      Son güncelleme:<br>
      <strong id="lastUpdate">—</strong>
    </div>
  </div>

  <div class="card login">
    <div class="login-grid">
      <div>
        <label>Kullanıcı adı</label>
        <input id="username" autocomplete="username">
      </div>
      <div>
        <label>Şifre</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>
      <div>
        <label>Bağlantı biçimi</label>
        <div class="auth-label">Authorization Basic</div>
      </div>
      <button class="btn btn-primary" id="connectBtn">Bağlan</button>
    </div>
  </div>

  <div id="errorBox" class="error"></div>

  <div class="summary">
    <div class="card stat">
      <div id="totalCount" class="stat-number">—</div>
      <div class="stat-label">Toplam cihaz</div>
    </div>
    <div class="card stat">
      <div id="onlineCount" class="stat-number">—</div>
      <div class="stat-label">Online</div>
    </div>
    <div class="card stat">
      <div id="offlineCount" class="stat-number">—</div>
      <div class="stat-label">Offline</div>
    </div>
    <div class="card stat">
      <div id="avgLatency" class="stat-number">—</div>
      <div class="stat-label">Ortalama gecikme</div>
    </div>
  </div>

  <div class="controls">
    <h2>Cihazlar</h2>
    <div class="controls-right">
      <input id="search" class="search" placeholder="Cihaz adı / ID / SN / IP ara">
      <button class="btn btn-light" id="refreshBtn">Yenile</button>
    </div>
  </div>

  <div id="deviceGrid" class="devices">
    <div class="card empty">Bağlan düğmesine basarak cihazları yükleyin.</div>
  </div>

  <div class="footer">
    Bu ekran yalnızca raporlama amacıyla tasarlanmıştır.
  </div>

</div>

<script>
const BASE = "https://api.diacloudsolutions.com.cn";

const state = {
  devices: [],
  registers: {},
  registerErrors: {},
  loadingRegisters: {}
};

const $ = id => document.getElementById(id);

function b64(text){
  const bytes = new TextEncoder().encode(text);
  let binary = "";
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

function getHeaders(){
  const username = $("username").value.trim();
  const password = $("password").value;

  if(!username || !password){
    throw new Error("Kullanıcı adı ve şifre gerekli.");
  }

  const token = b64(username + ":" + password);

  return {
    "Accept":"application/json",
    "Authorization":"Basic " + token
  };
}

function getArray(payload){
  if(Array.isArray(payload)) return payload;
  if(!payload || typeof payload !== "object") return [];

  for(const key of ["data","devices","regs","registers","items","list","rows","result"]){
    if(Array.isArray(payload[key])) return payload[key];
  }

  // Bazı API'ler data altında ikinci bir dizi döndürebilir.
  if(payload.data && typeof payload.data === "object"){
    for(const key of ["regs","registers","items","list","rows","result"]){
      if(Array.isArray(payload.data[key])) return payload.data[key];
    }
  }

  return [];
}

function value(obj,...keys){
  for(const key of keys){
    if(obj && obj[key] !== undefined && obj[key] !== null){
      return obj[key];
    }
  }
  return undefined;
}

function isOnline(v){
  return Number(v) === 1 ||
         v === true ||
         String(v).toLowerCase() === "online";
}

function safe(v){
  return (v === undefined || v === null || v === "") ? "—" : String(v);
}

function esc(v){
  return safe(v).replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[c]));
}

function showError(message){
  const box = $("errorBox");
  box.textContent = message;
  box.style.display = "block";
}

function hideError(){
  $("errorBox").style.display = "none";
}

async function apiGet(path){
  const response = await fetch(BASE + path, {
    method:"GET",
    headers:getHeaders(),
    mode:"cors",
    cache:"no-store"
  });

  const text = await response.text();
  let data;

  try{
    data = text ? JSON.parse(text) : null;
  }catch{
    data = text;
  }

  if(!response.ok){
    throw new Error("HTTP " + response.status);
  }

  return data;
}

function deviceIdOf(device){
  return value(device,"id","device_id","deviceId");
}

function registerAddress(reg){
  return value(reg,"addr","address","reg_addr","regAddr");
}

function registerLabel(reg){
  const alias = value(
    reg,
    "name",
    "alias_name",
    "aliasName",
    "alias",
    "label",
    "display_name",
    "displayName"
  );

  if(alias !== undefined && alias !== null && String(alias).trim() !== ""){
    return String(alias);
  }

  const addr = registerAddress(reg);

  if(addr !== undefined && addr !== null && String(addr).trim() !== ""){
    const s = String(addr);

    // API zaten M0, $2048 vb. biçiminde bir adres döndürüyorsa aynen göster.
    if(/^M\d+$/i.test(s) || /^\$/.test(s)){
      return s;
    }

    return "$" + s;
  }

  return "Register";
}

function registerValue(reg){
  return value(
    reg,
    "value",
    "Value",
    "reg_value",
    "regValue",
    "val",
    "current_value",
    "currentValue"
  );
}

function registerTime(reg){
  return value(
    reg,
    "time",
    "Time",
    "reg_time",
    "regTime",
    "timestamp",
    "update_time",
    "updateTime",
    "updated_at",
    "updatedAt",
    "date"
  );
}

async function loadDevices(){
  hideError();
  $("connectBtn").disabled = true;
  $("refreshBtn").disabled = true;

  try{
    const data = await apiGet("/devices");

    state.devices = getArray(data);
    state.registers = {};
    state.registerErrors = {};
    state.loadingRegisters = {};

    // Önce cihaz kartlarını hemen göster.
    render();

    // Sonra her cihazın registerlarını getir.
    await loadAllRegisters();

    $("lastUpdate").textContent = new Date().toLocaleString("tr-TR");

  }catch(err){
    showError(
      err instanceof TypeError
        ? "API bağlantısı kurulamadı. Tarayıcı CORS/preflight isteğini engelliyor olabilir."
        : "API bağlantısı başarısız: " + err.message
    );
  }finally{
    $("connectBtn").disabled = false;
    $("refreshBtn").disabled = false;
  }
}

async function loadAllRegisters(){
  const ids = state.devices
    .map(deviceIdOf)
    .filter(id => id !== undefined && id !== null && String(id) !== "");

  // Çok sayıda cihazda API'yi aynı anda aşırı yüklememek için 4'lü gruplar.
  const concurrency = 4;
  let cursor = 0;

  async function worker(){
    while(cursor < ids.length){
      const index = cursor++;
      const id = ids[index];

      state.loadingRegisters[String(id)] = true;
      render();

      try{
        const data = await apiGet(
          "/devices/" + encodeURIComponent(id) + "/regs"
        );

        state.registers[String(id)] = getArray(data);
        delete state.registerErrors[String(id)];

      }catch(err){
        state.registers[String(id)] = [];
        state.registerErrors[String(id)] = err.message;

      }finally{
        state.loadingRegisters[String(id)] = false;
        render();
      }
    }
  }

  const workers = [];
  for(let i = 0; i < Math.min(concurrency, ids.length); i++){
    workers.push(worker());
  }

  await Promise.all(workers);
}

function renderRegisterSection(device){
  const id = String(deviceIdOf(device) ?? "");

  if(state.loadingRegisters[id]){
    return `
      <div class="register-section">
        <div class="register-title">
          <span>Registers</span>
        </div>
        <div class="register-list">
          <div class="reg-loading">Register bilgileri yükleniyor…</div>
        </div>
      </div>
    `;
  }

  if(state.registerErrors[id]){
    return `
      <div class="register-section">
        <div class="register-title">
          <span>Registers</span>
        </div>
        <div class="register-list">
          <div class="reg-error">
            Register bilgisi alınamadı: ${esc(state.registerErrors[id])}
          </div>
        </div>
      </div>
    `;
  }

  const regs = state.registers[id];

  if(regs === undefined){
    return `
      <div class="register-section">
        <div class="register-title">
          <span>Registers</span>
        </div>
        <div class="register-list">
          <div class="reg-loading">Register bilgileri bekleniyor…</div>
        </div>
      </div>
    `;
  }

  if(!regs.length){
    return `
      <div class="register-section">
        <div class="register-title">
          <span>Registers</span>
          <span class="register-count">0 kayıt</span>
        </div>
        <div class="register-list">
          <div class="reg-empty">Register bulunamadı.</div>
        </div>
      </div>
    `;
  }

  return `
    <div class="register-section">
      <div class="register-title">
        <span>Registers</span>
        <span class="register-count">${regs.length} kayıt</span>
      </div>

      <div class="register-list">
        ${regs.map(reg => `
          <div class="reg-row">
            <div class="reg-name" title="${esc(registerLabel(reg))}">
              ${esc(registerLabel(reg))}
            </div>

            <div class="reg-value">
              ${esc(registerValue(reg))}
            </div>

            <div class="reg-time" title="${esc(registerTime(reg))}">
              ${esc(registerTime(reg))}
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function render(){
  const all = state.devices;

  const online = all.filter(d => isOnline(value(d,"online"))).length;
  const offline = all.length - online;

  const latencies = all
    .map(d => Number(value(d,"latency")))
    .filter(Number.isFinite);

  $("totalCount").textContent = all.length;
  $("onlineCount").textContent = online;
  $("offlineCount").textContent = offline;

  $("avgLatency").textContent =
    latencies.length
      ? Math.round(latencies.reduce((a,b)=>a+b,0) / latencies.length) + " ms"
      : "—";

  const q = $("search").value.trim().toLowerCase();

  const devices = all.filter(d => {
    const id = String(deviceIdOf(d) ?? "");
    const regs = state.registers[id] || [];

    const registerText = regs.map(r => [
      registerLabel(r),
      registerAddress(r),
      registerValue(r)
    ].join(" ")).join(" ");

    const text = [
      value(d,"name","device_name"),
      deviceIdOf(d),
      value(d,"sn","SN"),
      value(d,"ip","IP"),
      registerText
    ].join(" ").toLowerCase();

    return text.includes(q);
  });

  if(!devices.length){
    $("deviceGrid").innerHTML =
      '<div class="card empty">Gösterilecek cihaz bulunamadı.</div>';
    return;
  }

  $("deviceGrid").innerHTML = devices.map(d => {
    const online = isOnline(value(d,"online"));

    return `
      <div class="card device">

        <div class="device-head">
          <div>
            <div class="device-name">
              ${esc(value(d,"name","device_name") || "İsimsiz cihaz")}
            </div>

            <div class="device-id">
              ID: ${esc(deviceIdOf(d))}
            </div>
          </div>

          <div class="status ${online ? "online" : "offline"}">
            ${online ? "● ONLINE" : "● OFFLINE"}
          </div>
        </div>

        <div class="meta">
          <div class="meta-box">
            <div class="meta-label">IP</div>
            <div class="meta-value">${esc(value(d,"ip","IP"))}</div>
          </div>

          <div class="meta-box">
            <div class="meta-label">SN</div>
            <div class="meta-value">${esc(value(d,"sn","SN"))}</div>
          </div>

          <div class="meta-box">
            <div class="meta-label">Gecikme</div>
            <div class="meta-value">
              ${value(d,"latency") !== undefined
                ? esc(value(d,"latency")) + " ms"
                : "—"}
            </div>
          </div>
        </div>

        ${renderRegisterSection(d)}

      </div>
    `;
  }).join("");
}

$("connectBtn").onclick = loadDevices;
$("refreshBtn").onclick = loadDevices;
$("search").oninput = render;
</script>

</body>
</html>
