<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIACloud Durum Raporu</title>
<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#718096;
  --line:#e4e9f1;
  --green:#14966f;
  --red:#d94c5c;
  --blue:#2f6fed;
  --shadow:0 8px 24px rgba(20,31,52,.06);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}
button,input,select{font:inherit}
.wrap{max-width:1180px;margin:auto;padding:28px 18px 48px}
.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  margin-bottom:24px;
}
h1{margin:0;font-size:28px;letter-spacing:-.03em}
.subtitle{color:var(--muted);margin-top:6px;font-size:14px}
.refresh-info{font-size:12px;color:var(--muted);text-align:right}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
}
.login{
  padding:16px;
  margin-bottom:18px;
}
.login-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto;
  gap:10px;
  align-items:end;
}
label{
  display:block;
  font-size:11px;
  font-weight:700;
  color:var(--muted);
  margin-bottom:5px;
}
input,select{
  width:100%;
  border:1px solid #d9e0ea;
  background:#fff;
  color:var(--text);
  padding:10px 11px;
  border-radius:9px;
  outline:none;
}
.auth-label{
  width:100%;
  border:1px solid #d9e0ea;
  background:#f8fafc;
  color:#334155;
  padding:10px 11px;
  border-radius:9px;
  font-weight:750;
}
input:focus,select:focus{border-color:#8eb1f5;box-shadow:0 0 0 3px rgba(47,111,237,.08)}
.btn{
  border:0;
  border-radius:9px;
  padding:10px 16px;
  font-weight:800;
  cursor:pointer;
}
.btn-primary{background:var(--blue);color:white}
.btn-light{background:#edf2f8;color:#334155}
.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}
.stat{padding:18px}
.stat-number{font-size:30px;font-weight:900;line-height:1}
.stat-label{font-size:12px;color:var(--muted);margin-top:7px}
.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}
.controls h2{margin:0;font-size:18px}
.controls-right{display:flex;gap:8px;align-items:center}
.search{max-width:260px}
.devices{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.device{
  padding:18px;
  min-height:180px;
}
.device-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}
.device-name{font-size:18px;font-weight:850}
.device-id{font-size:11px;color:var(--muted);margin-top:3px}
.status{
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:850;
  white-space:nowrap;
}
.status.online{background:#e7f7f1;color:var(--green)}
.status.offline{background:#fdecee;color:var(--red)}
.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:18px;
}
.meta-box{
  background:#f8fafc;
  border:1px solid #edf0f5;
  padding:10px;
  border-radius:10px;
  min-width:0;
}
.meta-label{
  font-size:10px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.05em;
}
.meta-value{
  margin-top:4px;
  font-size:13px;
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.empty{
  grid-column:1/-1;
  text-align:center;
  padding:44px 20px;
  color:var(--muted);
}
.error{
  background:#fff4f5;
  color:#a72d3c;
  border:1px solid #f4cbd0;
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:16px;
  display:none;
}
.footer{
  margin-top:22px;
  color:#9aa6b5;
  text-align:center;
  font-size:11px;
}
@media(max-width:850px){
  .login-grid{grid-template-columns:1fr 1fr}
  .summary{grid-template-columns:repeat(2,1fr)}
  .devices{grid-template-columns:1fr}
}
@media(max-width:560px){
  .wrap{padding:18px 12px 35px}
  .header,.controls{flex-direction:column}
  .refresh-info{text-align:left}
  .login-grid{grid-template-columns:1fr}
  .summary{grid-template-columns:1fr 1fr}
  .meta{grid-template-columns:1fr 1fr}
  .controls-right{width:100%;flex-wrap:wrap}
  .search{max-width:none}
}
</style>
</head>
<body>

<div class="wrap">

  <div class="header">
    <div>
      <h1>Sistem Durum Raporu</h1>
      <div class="subtitle">Cihazların güncel bağlantı durumu</div>
    </div>
    <div class="refresh-info">
      Son güncelleme:<br>
      <strong id="lastUpdate">—</strong>
    </div>
  </div>

  <div class="card login">
    <div class="login-grid">
      <div>
        <label>Kullanıcı adı</label>
        <input id="username" autocomplete="username">
      </div>
      <div>
        <label>Şifre</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>
      <div>
        <label>Bağlantı biçimi</label>
        <div class="auth-label">Authorization Basic</div>
      </div>
      <button class="btn btn-primary" id="connectBtn">Bağlan</button>
    </div>
  </div>

  <div id="errorBox" class="error"></div>

  <div class="summary">
    <div class="card stat">
      <div id="totalCount" class="stat-number">—</div>
      <div class="stat-label">Toplam cihaz</div>
    </div>
    <div class="card stat">
      <div id="onlineCount" class="stat-number">—</div>
      <div class="stat-label">Online</div>
    </div>
    <div class="card stat">
      <div id="offlineCount" class="stat-number">—</div>
      <div class="stat-label">Offline</div>
    </div>
    <div class="card stat">
      <div id="avgLatency" class="stat-number">—</div>
      <div class="stat-label">Ortalama gecikme</div>
    </div>
  </div>

  <div class="controls">
    <h2>Cihazlar</h2>
    <div class="controls-right">
      <input id="search" class="search" placeholder="Cihaz ara">
      <button class="btn btn-light" id="refreshBtn">Yenile</button>
    </div>
  </div>

  <div id="deviceGrid" class="devices">
    <div class="card empty">Bağlan düğmesine basarak cihazları yükleyin.</div>
  </div>

  <div class="footer">
    Bu ekran yalnızca raporlama amacıyla tasarlanmıştır.
  </div>

</div>

<script>
const BASE = "https://api.diacloudsolutions.com.cn";
const state = { devices: [] };

const $ = id => document.getElementById(id);

function b64(text){
  const bytes = new TextEncoder().encode(text);
  let binary = "";
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

function getHeaders(){
  const username = $("username").value.trim();
  const password = $("password").value;
  if(!username || !password) throw new Error("Kullanıcı adı ve şifre gerekli.");

  const token = b64(username + ":" + password);
  return {
    "Accept":"application/json",
    "Authorization":"Basic " + token
  };
}

function getArray(payload){
  if(Array.isArray(payload)) return payload;
  if(!payload || typeof payload !== "object") return [];

  for(const key of ["data","devices","items","list","rows","result"]){
    if(Array.isArray(payload[key])) return payload[key];
  }
  return [];
}

function value(obj,...keys){
  for(const key of keys){
    if(obj && obj[key] !== undefined && obj[key] !== null){
      return obj[key];
    }
  }
  return undefined;
}

function isOnline(v){
  return Number(v) === 1 ||
         v === true ||
         String(v).toLowerCase() === "online";
}

function safe(v){
  return (v === undefined || v === null || v === "") ? "—" : String(v);
}

function esc(v){
  return safe(v).replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[c]));
}

function showError(message){
  const box = $("errorBox");
  box.textContent = message;
  box.style.display = "block";
}

function hideError(){
  $("errorBox").style.display = "none";
}

async function loadDevices(){
  hideError();
  $("connectBtn").disabled = true;
  $("refreshBtn").disabled = true;

  try{
    const response = await fetch(BASE + "/devices", {
      method:"GET",
      headers:getHeaders(),
      mode:"cors",
      cache:"no-store"
    });

    const text = await response.text();
    let data;

    try{
      data = text ? JSON.parse(text) : null;
    }catch{
      data = text;
    }

    if(!response.ok){
      throw new Error("API hatası: HTTP " + response.status);
    }

    state.devices = getArray(data);
    render();
    $("lastUpdate").textContent = new Date().toLocaleString("tr-TR");

  }catch(err){
    showError(
      err instanceof TypeError
      ? "API bağlantısı kurulamadı. Tarayıcı CORS/preflight isteğini engelliyor olabilir."
      : err.message
    );
  }finally{
    $("connectBtn").disabled = false;
    $("refreshBtn").disabled = false;
  }
}

function render(){
  const all = state.devices;

  const online = all.filter(d => isOnline(value(d,"online"))).length;
  const offline = all.length - online;

  const latencies = all
    .map(d => Number(value(d,"latency")))
    .filter(Number.isFinite);

  $("totalCount").textContent = all.length;
  $("onlineCount").textContent = online;
  $("offlineCount").textContent = offline;
  $("avgLatency").textContent =
    latencies.length
      ? Math.round(latencies.reduce((a,b)=>a+b,0)/latencies.length) + " ms"
      : "—";

  const q = $("search").value.trim().toLowerCase();

  const devices = all.filter(d => {
    const text = [
      value(d,"name","device_name"),
      value(d,"id","device_id"),
      value(d,"sn","SN"),
      value(d,"ip","IP")
    ].join(" ").toLowerCase();

    return text.includes(q);
  });

  if(!devices.length){
    $("deviceGrid").innerHTML =
      '<div class="card empty">Gösterilecek cihaz bulunamadı.</div>';
    return;
  }

  $("deviceGrid").innerHTML = devices.map(d => {
    const online = isOnline(value(d,"online"));

    return `
      <div class="card device">
        <div class="device-head">
          <div>
            <div class="device-name">
              ${esc(value(d,"name","device_name") || "İsimsiz cihaz")}
            </div>
            <div class="device-id">
              ID: ${esc(value(d,"id","device_id"))}
            </div>
          </div>

          <div class="status ${online ? "online" : "offline"}">
            ${online ? "● ONLINE" : "● OFFLINE"}
          </div>
        </div>

        <div class="meta">
          <div class="meta-box">
            <div class="meta-label">IP</div>
            <div class="meta-value">${esc(value(d,"ip","IP"))}</div>
          </div>

          <div class="meta-box">
            <div class="meta-label">SN</div>
            <div class="meta-value">${esc(value(d,"sn","SN"))}</div>
          </div>

          <div class="meta-box">
            <div class="meta-label">Gecikme</div>
            <div class="meta-value">
              ${value(d,"latency") !== undefined ? esc(value(d,"latency")) + " ms" : "—"}
            </div>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

$("connectBtn").onclick = loadDevices;
$("refreshBtn").onclick = loadDevices;
$("search").oninput = render;
</script>

</body>
</html>
